
<h1 class="text-center text-3xl font-bold mb-8"> {{ title }}</h1>
<div class="flex justify-between mb-16 ml-4 mr-4">
    <app-filters ></app-filters>
    <input type="text" name="searchValue" id="search-value" [(ngModel)]="searchValue">
</div>

<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-5 xl:grid-cols-7">
    <div class="w-45 h-45 bg-white shadow-lg rounded-lg flex flex-col items-center justify-center border-solid border-2" *ngFor="let pokemon of pokemons | search : searchValue">
        <div class="text-center">{{pokemon.name}}</div>
        <img class="size-32" src="{{pokemon.image}}">
        <div class="text-center">{{pokemon.type}}</div>
    </div>
</div>
